<html lang="uz"><head>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4f7fb;
  --card: #ffffff;
  --tx: #0f1b34;
  --mut: #5a6a85;
  --pri: #1e4fd6;
  --pri2: #2563eb;
  --acc: #0ea5e9;
  --bd: #e2e8f0;
  --nav: #0a1628;
  --top: #0a1628;
  --sh: 0 4px 20px -4px rgba(15, 27, 52, 0.08);
  --shh: 0 12px 40px -8px rgba(30, 79, 214, 0.18);
  --radius: 14px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; scroll-padding-top: 80px; }
body {
  font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--tx);
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
img { max-width: 100%; display: block; }
.w { max-width: 1180px; margin: 0 auto; padding: 0 20px; }

/* ========== TOP BAR ========== */
.top {
  background: var(--top);
  color: #94a3b8;
  font-size: 12.5px;
}
.top .w {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 10px 24px;
  padding: 9px 20px;
}
.top-left { display: flex; flex-wrap: wrap; gap: 6px 22px; align-items: center; }
.top-left span { display: inline-flex; align-items: center; gap: 6px; }
.top-right { display: flex; align-items: center; gap: 16px; }
.top-social { display: flex; gap: 10px; }
.top-social a {
  width: 28px; height: 28px;
  border-radius: 50%;
  background: rgba(255,255,255,0.08);
  display: grid; place-items: center;
  color: #cbd5e1;
  font-size: 13px;
  transition: .2s;
}
.top-social a:hover { background: var(--pri); color: #fff; }
.top-student {
  background: rgba(255,255,255,0.1);
  padding: 5px 12px;
  border-radius: 8px;
  font-weight: 500;
  color: #e2e8f0;
  font-size: 12.5px;
}

/* ========== HEADER ========== */
header {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(255,255,255,0.95);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--bd);
  box-shadow: 0 1px 0 rgba(0,0,0,0.03);
}
header .w {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 12px 20px;
}
.logo {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}
.logo-img {
  width: 52px; height: 52px;
  border-radius: 50%;
  background: linear-gradient(145deg, #1e4fd6, #0ea5e9);
  display: grid; place-items: center;
  color: #fff;
  font-size: 22px;
  box-shadow: 0 4px 14px -2px rgba(30,79,214,0.45);
  border: 2px solid #fff;
  position: relative;
}
.logo-img::after {
  content: "";
  position: absolute;
  inset: -3px;
  border-radius: 50%;
  border: 1.5px solid rgba(30,79,214,0.25);
}
.logo-text b {
  display: block;
  font-size: 15px;
  font-weight: 800;
  letter-spacing: -0.3px;
  color: var(--tx);
  line-height: 1.2;
}
.logo-text i {
  font-size: 11.5px;
  color: var(--mut);
  font-style: normal;
  font-weight: 500;
}
nav {
  display: flex;
  align-items: center;
  gap: 2px;
}
nav a {
  padding: 8px 14px;
  font-size: 14px;
  font-weight: 600;
  color: var(--mut);
  border-radius: 8px;
  transition: .2s;
  position: relative;
}
nav a:hover { color: var(--pri); background: rgba(30,79,214,0.06); }
nav a.on {
  color: var(--pri);
  background: transparent;
}
nav a.on::after {
  content: "";
  position: absolute;
  left: 14px; right: 14px; bottom: 4px;
  height: 2.5px;
  background: var(--pri);
  border-radius: 2px;
}
#bg {
  display: none;
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 10px;
  font-size: 20px;
  padding: 7px 12px;
  color: var(--tx);
  cursor: pointer;
}
@media (max-width: 960px) {
  #bg { display: block; }
  nav {
    display: none;
    position: absolute;
    left: 0; right: 0; top: 100%;
    flex-direction: column;
    background: var(--card);
    padding: 12px 20px 18px;
    border-bottom: 1px solid var(--bd);
    box-shadow: var(--sh);
  }
  nav.o { display: flex; }
  nav a { padding: 12px 14px; }
  nav a.on::after { display: none; }
  nav a.on { background: rgba(30,79,214,0.08); }
}

/* ========== HERO ========== */
.hero {
  position: relative;
  color: #fff;
  overflow: hidden;
  min-height: 480px;
  display: flex;
  align-items: center;
  background:
    linear-gradient(105deg, rgba(8,18,40,0.92) 0%, rgba(8,18,40,0.75) 42%, rgba(8,18,40,0.35) 100%),
    url("https://images.unsplash.com/photo-1562774053-701939374585?w=1600&q=80") center/cover no-repeat;
}
.hero .w {
  position: relative;
  z-index: 2;
  padding: 72px 20px 100px;
  max-width: 1180px;
}
.hero-kicker {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 1.8px;
  text-transform: uppercase;
  color: #bfdbfe;
  margin-bottom: 16px;
}
.hero-kicker::before {
  content: "";
  width: 8px; height: 8px;
  border-radius: 50%;
  background: #38bdf8;
  box-shadow: 0 0 0 4px rgba(56,189,248,0.25);
}
.hero h1 {
  font-size: clamp(32px, 5.5vw, 52px);
  font-weight: 800;
  line-height: 1.12;
  letter-spacing: -1.2px;
  max-width: 560px;
  margin-bottom: 16px;
  text-shadow: 0 2px 12px rgba(0,0,0,0.25);
}
.hero p {
  font-size: 16.5px;
  color: #c7d2e8;
  max-width: 480px;
  margin-bottom: 28px;
  line-height: 1.6;
}
.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: var(--pri);
  color: #fff;
  padding: 13px 24px;
  border-radius: 10px;
  font-weight: 600;
  font-size: 14.5px;
  border: 0;
  cursor: pointer;
  box-shadow: 0 8px 24px -6px rgba(30,79,214,0.55);
  transition: .2s;
}
.btn:hover {
  background: #1a44c0;
  transform: translateY(-2px);
  box-shadow: 0 12px 28px -6px rgba(30,79,214,0.65);
}
.hero-badge {
  position: absolute;
  right: 24px;
  bottom: 36px;
  background: rgba(15, 30, 60, 0.65);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.15);
  padding: 14px 18px;
  border-radius: 12px;
  font-size: 13px;
  font-weight: 600;
  max-width: 240px;
  color: #e2e8f0;
  display: flex;
  align-items: flex-start;
  gap: 10px;
}
.hero-badge span { font-size: 22px; line-height: 1; }

/* ========== QUICK LINKS ========== */
.qs-wrap { position: relative; z-index: 3; margin-top: -48px; }
.qs {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 14px;
}
@media (max-width: 1100px) { .qs { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 600px) { .qs { grid-template-columns: repeat(2, 1fr); } }
.q {
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: var(--radius);
  padding: 20px 16px;
  text-align: center;
  box-shadow: var(--sh);
  transition: .25s;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.q:hover {
  transform: translateY(-4px);
  box-shadow: var(--shh);
  border-color: rgba(30,79,214,0.3);
}
.q .ic {
  width: 48px; height: 48px;
  border-radius: 12px;
  background: linear-gradient(145deg, #eff4ff, #e0ecff);
  color: var(--pri);
  display: grid; place-items: center;
  font-size: 22px;
  margin-bottom: 12px;
}
.q b { font-size: 13.5px; font-weight: 700; color: var(--tx); margin-bottom: 4px; }
.q p { font-size: 12px; color: var(--mut); line-height: 1.4; }

/* ========== SECTIONS ========== */
.sec { padding: 40px 0; }
.box {
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 16px;
  padding: 24px;
  box-shadow: var(--sh);
  margin-bottom: 20px;
}
.box h2, .sec-title {
  font-size: 18px;
  font-weight: 800;
  letter-spacing: -0.3px;
  margin-bottom: 18px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.cols {
  display: grid;
  grid-template-columns: 1.7fr 1fr;
  gap: 20px;
}
@media (max-width: 900px) { .cols { grid-template-columns: 1fr; } }

/* News cards */
.ng {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 16px;
}
.n {
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 14px;
  overflow: hidden;
  transition: .25s;
  box-shadow: var(--sh);
}
.n:hover {
  transform: translateY(-4px);
  box-shadow: var(--shh);
}
.n .im {
  height: 150px;
  background: linear-gradient(135deg, #1e3a8a, #3b82f6) center/cover;
  position: relative;
}
.n .im em {
  position: absolute;
  left: 10px; bottom: 10px;
  background: #fff;
  color: var(--pri);
  font-style: normal;
  font-weight: 700;
  font-size: 11px;
  padding: 4px 10px;
  border-radius: 999px;
}
.n .b { padding: 14px 16px 16px; }
.n h3 { font-size: 14.5px; font-weight: 700; margin-bottom: 6px; line-height: 1.35; }
.n small { color: var(--mut); font-size: 12px; display: block; margin-bottom: 6px; }
.n p { font-size: 13px; color: var(--mut); line-height: 1.45; }
.n .more { display: inline-block; margin-top: 10px; font-size: 13px; font-weight: 600; color: var(--pri); }

/* Announcements */
.a {
  display: flex;
  gap: 14px;
  align-items: flex-start;
  padding: 12px 0;
  border-bottom: 1px solid var(--bd);
  font-size: 13.5px;
}
.a:last-child { border: 0; }
.d {
  min-width: 48px;
  text-align: center;
  background: #eff4ff;
  border-radius: 10px;
  padding: 7px 4px;
  font-weight: 800;
  font-size: 17px;
  color: var(--pri);
  line-height: 1.15;
}
.d small {
  display: block;
  font-size: 10.5px;
  font-weight: 600;
  color: var(--mut);
  text-transform: lowercase;
}
.a span { flex: 1; padding-top: 4px; }

/* Event box */
.ev {
  background: linear-gradient(135deg, #1e4fd6, #2563eb 60%, #0ea5e9);
  color: #fff;
  border: 0;
}
.ev h2 { color: #fff; }
.ev .a { border-color: rgba(255,255,255,0.2); }
.ev .d { background: #fff; color: var(--pri); }
.ev small { color: #dbeafe; }

/* Stats */
.st {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
}
@media (max-width: 800px) { .st { grid-template-columns: repeat(2, 1fr); } }
.s {
  display: flex;
  gap: 14px;
  align-items: center;
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 14px;
  padding: 18px 16px;
  box-shadow: var(--sh);
}
.s .ic {
  width: 50px; height: 50px;
  border-radius: 12px;
  background: #eff4ff;
  color: var(--pri);
  display: grid; place-items: center;
  font-size: 22px;
  flex-shrink: 0;
}
.s b {
  font-size: 24px;
  font-weight: 800;
  color: var(--tx);
  display: block;
  line-height: 1.1;
  letter-spacing: -0.5px;
}
.s small {
  color: var(--mut);
  font-size: 12px;
  display: block;
}
.s .label { font-size: 12.5px; font-weight: 600; color: var(--mut); margin-bottom: 2px; }

/* Page header (inner pages) */
.ph {
  background: linear-gradient(135deg, #0a1628 0%, #1e3a6e 100%);
  color: #fff;
  padding: 56px 0 48px;
}
.ph .w { max-width: 1180px; }
.ph h1 {
  font-size: clamp(28px, 4.5vw, 40px);
  font-weight: 800;
  letter-spacing: -1px;
  margin-bottom: 10px;
}
.ph p { color: #94a3b8; font-size: 15.5px; max-width: 560px; }

/* Cards grid */
.g3 {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 18px;
}
.c {
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 16px;
  padding: 22px;
  box-shadow: var(--sh);
  transition: .25s;
}
.c:hover {
  transform: translateY(-4px);
  box-shadow: var(--shh);
  border-color: rgba(30,79,214,0.25);
}
.c .ic {
  width: 46px; height: 46px;
  border-radius: 12px;
  background: #eff4ff;
  color: var(--pri);
  display: grid; place-items: center;
  font-size: 20px;
  margin-bottom: 12px;
}
.c b { font-size: 15px; font-weight: 700; display: block; margin-bottom: 6px; }
.c p { font-size: 13.5px; color: var(--mut); }
.tag {
  display: inline-block;
  margin-top: 10px;
  background: #eff4ff;
  color: var(--pri);
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
}

/* Timeline (admission steps) */
.tl { counter-reset: s; }
.tl .a { align-items: flex-start; gap: 16px; }
.tl .a::before {
  counter-increment: s;
  content: counter(s);
  min-width: 34px; height: 34px;
  border-radius: 50%;
  background: var(--pri);
  color: #fff;
  display: grid; place-items: center;
  font-weight: 700;
  font-size: 14px;
  flex-shrink: 0;
}

/* Schedule */
.sch-group { margin-bottom: 24px; }
.sch-group h3 { margin: 0 0 12px; font-size: 16px; font-weight: 800; }
.sch-days {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  gap: 12px;
}
.sch-day {
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 12px;
  padding: 14px;
  box-shadow: var(--sh);
}
.sch-day b { display: block; margin-bottom: 8px; color: var(--pri); font-size: 13.5px; }
.sch-day pre {
  margin: 0;
  font-family: inherit;
  font-size: 12.5px;
  color: var(--mut);
  white-space: pre-wrap;
  line-height: 1.55;
}

/* Gallery */
.gal {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 14px;
}
.gal-item {
  position: relative;
  border-radius: 14px;
  overflow: hidden;
  border: 1px solid var(--bd);
  background: var(--card);
  aspect-ratio: 1;
  box-shadow: var(--sh);
}
.gal-item img { width: 100%; height: 100%; object-fit: cover; }
.gal-item .cap {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  padding: 10px 12px;
  background: linear-gradient(transparent, rgba(0,0,0,0.75));
  color: #fff;
  font-size: 12.5px;
  font-weight: 600;
}
.gal-item .gal-del {
  position: absolute;
  top: 8px; right: 8px;
  background: #ef4444;
  color: #fff;
  border: 0;
  border-radius: 8px;
  padding: 4px 8px;
  font-size: 11px;
  cursor: pointer;
  display: none;
}
body.admin-ok .gal-item .gal-del { display: block; }
.gal-upload {
  border: 2px dashed var(--bd);
  border-radius: 14px;
  padding: 28px;
  text-align: center;
  background: var(--card);
  display: none;
  margin-bottom: 18px;
}
body.admin-ok .gal-upload { display: block; }
.gal-empty {
  text-align: center;
  padding: 48px 20px;
  color: var(--mut);
  font-size: 14px;
}

/* Form inputs */
input, textarea, select {
  font: inherit;
  color: var(--tx);
}
.form-input {
  width: 100%;
  padding: 11px 14px;
  border-radius: 10px;
  border: 1px solid var(--bd);
  background: var(--bg);
  margin-bottom: 10px;
  font-size: 14px;
}
.form-input:focus {
  outline: none;
  border-color: var(--pri);
  box-shadow: 0 0 0 3px rgba(30,79,214,0.12);
}
label.form-lbl {
  display: block;
  font-size: 12.5px;
  color: var(--mut);
  margin: 8px 0 4px;
  font-weight: 500;
}

/* Footer */
footer {
  background: var(--nav);
  color: #94a3b8;
  margin-top: 48px;
  font-size: 13.5px;
}
footer .w {
  padding: 40px 20px 28px;
  display: grid;
  grid-template-columns: 1.4fr 1fr 1fr 1fr;
  gap: 28px;
}
@media (max-width: 800px) {
  footer .w { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 500px) {
  footer .w { grid-template-columns: 1fr; }
}
footer b { color: #fff; font-weight: 700; display: block; margin-bottom: 10px; }
footer a { display: block; padding: 3px 0; color: #94a3b8; transition: .15s; }
footer a:hover { color: #fff; }
footer .copy {
  border-top: 1px solid rgba(255,255,255,0.08);
  padding: 16px 20px;
  text-align: center;
  font-size: 12.5px;
  color: #64748b;
}
.footer-logo {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}
.footer-logo .lg {
  width: 40px; height: 40px;
  border-radius: 50%;
  background: linear-gradient(145deg, #1e4fd6, #0ea5e9);
  display: grid; place-items: center;
  color: #fff;
  font-size: 18px;
}

/* Admin & Login */
#fab {
  position: fixed;
  right: 16px;
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  z-index: 9;
  opacity: 0.85;
  font-size: 13px;
  padding: 10px 16px;
}
#fab:hover { opacity: 1; }
#login-modal {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(6,13,31,0.75);
  backdrop-filter: blur(8px);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
#login-modal.show { display: flex; }
#login-box {
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 18px;
  padding: 28px 24px;
  width: min(360px, 100%);
  box-shadow: 0 24px 48px -16px rgba(30,79,214,0.28);
}
#login-box h2 { margin: 0 0 6px; font-size: 20px; font-weight: 800; }
#login-box p { margin: 0 0 16px; font-size: 13px; color: var(--mut); }
#login-box input {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid var(--bd);
  border-radius: 10px;
  background: var(--bg);
  color: var(--tx);
  font: inherit;
  font-size: 14px;
  margin-bottom: 12px;
}
#login-box .err {
  color: #ef4444;
  font-size: 12.5px;
  margin: -4px 0 10px;
  display: none;
}
#login-box .row { display: flex; gap: 8px; }
#login-box .row .btn { flex: 1; text-align: center; justify-content: center; }
#login-box .sm {
  flex: 0 0 auto;
  background: var(--bg);
  color: var(--tx);
  border: 1px solid var(--bd);
  padding: 10px 14px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 13px;
}
#admin {
  position: fixed;
  top: 0; right: 0; bottom: 0;
  width: min(420px, 100%);
  background: var(--card);
  border-left: 1px solid var(--bd);
  z-index: 60;
  overflow: auto;
  padding: calc(14px + env(safe-area-inset-top, 0px)) 16px 90px;
  display: none;
  box-shadow: -8px 0 30px rgba(0,0,0,0.12);
}
body.ad #admin { display: block; }
#admin h3 {
  margin: 14px 0 4px;
  font-size: 12px;
  text-transform: uppercase;
  color: var(--pri);
  letter-spacing: 0.4px;
}
#admin label {
  display: block;
  font-size: 12px;
  color: var(--mut);
  margin: 8px 0 2px;
}
#admin input, #admin textarea {
  width: 100%;
  padding: 9px;

function fx() {
  const els = document.querySelectorAll('#site .q, #site .box, #site .c, #site .n, #site .s');
  if (!('IntersectionObserver' in window)) return;
  const io = new IntersectionObserver(es => es.forEach(x => {
    if (x.isIntersecting) {
      x.target.classList.add('in');
      io.unobserve(x.target);
      x.target.querySelectorAll('.s b').forEach(cnt);
    }
  }), { threshold: 0.08 });
  els.forEach((e, i) => {
    e.classList.add('rv');
    e.style.transitionDelay = (i % 5) * 60 + 'ms';
    io.observe(e);
  });
}

function cnt(b) {
  const m = b.textContent.match(/^(\d+)(.*)$/);
  if (!m || b.dataset.d) return;
  b.dataset.d = 1;
  const n = +m[1], t0 = performance.now();
  (function f(t) {
    const p = Math.min(1, (t - t0) / 1100);
    b.textContent = Math.round(n * (1 - Math.pow(1 - p, 3))) + m[2];
    if (p < 1) requestAnimationFrame(f);
  })(t0);
}

function ed(o, p) {
  if (Array.isArray(o)) {
    return o.map((x, i) => `<div class="it">${ed(x, [...p, i])}<button class="sm" data-del="${P([...p, i])}">🗑 O'chirish</button></div>`).join('') +
      `<button class="sm" data-add="${P(p)}">＋ Qo'shish</button>`;
  }
  if (o && typeof o === 'object') {
    return Object.entries(o).map(([k, v]) =>
      typeof v === 'object'
        ? `<h3>${E(k)}</h3>${ed(v, [...p, k])}`
        : `<label>${E(L[k] || k)}</label>` +
          (k === 'img'
            ? `<input data-p="${P([...p, k])}" value="${E(String(v).startsWith('data:') ? '(yuklangan rasm)' : v)}" placeholder="Rasm URL yoki fayl"><input type="file" accept="image/*" data-f="${P([...p, k])}">`
            : (String(v).length > 70
              ? `<textarea rows="4" data-p="${P([...p, k])}">${E(v)}</textarea>`
              : `<input data-p="${P([...p, k])}" value="${E(v)}">`))
    ).join('');
  }
  return '';
}

function resetLoginUI() {
  loginStep = 1;
  $('#step1').style.display = 'block';
  $('#step2').style.display = 'none';
  $('#login-title').textContent = '🔐 Admin kirish';
  $('#login-hint').textContent = '1-bosqich: asosiy parolni kiriting.';
  $('#login-step-ind').textContent = 'Bosqich 1 / 2';
  $('#login-btn').textContent = 'Davom etish';
  $('#login-err').style.display = 'none';
  $('#login-err').textContent = "Noto‘g‘ri parol!";
  if ($('#login-pass')) $('#login-pass').value = '';
  if ($('#login-code')) $('#login-code').value = '';
}

function showLogin() {
  resetLoginUI();
  $('#login-modal').classList.add('show');
  setTimeout(() => $('#login-pass').focus(), 50);
}

function hideLogin() {
  $('#login-modal').classList.remove('show');
  resetLoginUI();
}

async function tryLogin() {
  $('#login-err').style.display = 'none';
  if (loginStep === 1) {
    const val = ($('#login-pass').value || '').trim();
    if (await sha(val) === ADMIN_PASS_H) {
      loginStep = 2;
      $('#step1').style.display = 'none';
      $('#step2').style.display = 'block';
      $('#login-title').textContent = '🔐 Ikki bosqichli tasdiqlash';
      $('#login-hint').textContent = '2-bosqich: tasdiqlash kodini kiriting.';
      $('#login-step-ind').textContent = 'Bosqich 2 / 2';
      $('#login-btn').textContent = 'Kirish';
      setTimeout(() => $('#login-code').focus(), 50);
    } else {
      $('#login-err').textContent = "Noto‘g‘ri parol!";
      $('#login-err').style.display = 'block';
      $('#login-pass').focus();
    }
  } else {
    const code = ($('#login-code').value || '').trim();
    if (await sha(code) === ADMIN_CODE_H) {
      setAuth(true);
      hideLogin();
      document.body.classList.add('ad');
      panel();
    } else {
      $('#login-err').textContent = "Noto‘g‘ri tasdiqlash kodi!";
      $('#login-err').style.display = 'block';
      $('#login-code').focus();
    }
  }
}

function buildDownloadHtml() {
  const c = document.documentElement.cloneNode(true);
  const siteEl = c.querySelector('#site');
  if (siteEl) siteEl.innerHTML = '';
  const adminEl = c.querySelector('#admin');
  if (adminEl) adminEl.innerHTML = '';
  const body = c.querySelector('body');
  if (body) body.className = '';
  const dataEl = c.querySelector('#data');
  if (dataEl) dataEl.textContent = JSON.stringify(D).replace(/</g, '\\u003c');
  return '<!DOCTYPE html>\n' + c.outerHTML;
}

document.addEventListener('input', e => {
  const p = e.target.dataset.p;
  if (p) {
    const a = JSON.parse(p), l = a.pop();
    get(a)[l] = e.target.value;
    page(1);
  }
});

document.addEventListener('change', e => {
  const f = e.target.dataset.f;
  if (!f || !e.target.files[0]) return;
  const a = JSON.parse(f), l = a.pop(), im = new Image();
  im.onload = () => {
    const r = Math.min(1, 900 / im.width);
    const c = document.createElement('canvas');
    c.width = im.width * r;
    c.height = im.height * r;
    c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
    get(a)[l] = c.toDataURL('image/jpeg', 0.75);
    page(1);
    if (isAuthed()) panel();
  };
  im.src = URL.createObjectURL(e.target.files[0]);
});

document.addEventListener('click', e => {
  const t = e.target;
  if (t.id === 'fab') {
    if (!isAuthed()) { showLogin(); return; }
    document.body.classList.add('ad');
    panel();
  }
  if (t.id === 'cl') document.body.classList.remove('ad');
  if (t.id === 'login-btn') tryLogin();
  if (t.id === 'login-cancel') hideLogin();
  if (t.id === 'logout') {
    setAuth(false);
    alert('Admin sessiyasi yopildi.');
  }
  if (t.id === 'ariza-clear') {
    if (confirm('Barcha mahalliy arizalarni o‘chirish?')) {
      localStorage.removeItem(LS_ARIZA);
      panel();
    }
  }
  if (t.dataset.arizaDel != null) {
    const list = getArizalar();
    list.splice(+t.dataset.arizaDel, 1);
    localStorage.setItem(LS_ARIZA, JSON.stringify(list));
    panel();
  }
  if (t.dataset.galDel != null) {
    if (!isAuthed()) return;
    const items = (D.gallery && D.gallery.items) || [];
    items.splice(+t.dataset.galDel, 1);
    if (!D.gallery) D.gallery = { title: 'Galereya', text: '', items: [] };
    D.gallery.items = items;
    try { localStorage.setItem(LS_KEY, JSON.stringify(D)); } catch (e) {}
    page(1);
  }
  if (t.id === 'gal-add') {
    if (!isAuthed()) { showLogin(); return; }
    const files = $('#gal-files') && $('#gal-files').files;
    if (!files || !files.length) { alert('Rasm tanlang'); return; }
    const cap = ($('#gal-cap') && $('#gal-cap').value) || '';
    if (!D.gallery) D.gallery = { title: 'Galereya', text: '', items: [] };
    if (!D.gallery.items) D.gallery.items = [];
    const btn = t;
    btn.textContent = 'Yuklanmoqda…';
    btn.disabled = true;
    let left = files.length;
    Array.from(files).forEach(file => {
      const im = new Image();
      const url = URL.createObjectURL(file);
      im.onload = () => {
        const r = Math.min(1, 1200 / im.width);
        const c = document.createElement('canvas');
        c.width = im.width * r;
        c.height = im.height * r;
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        const dataUrl = c.toDataURL('image/jpeg', 0.72);
        D.gallery.items.push({ img: dataUrl, cap: cap });
        URL.revokeObjectURL(url);
        left--;
        if (left === 0) {
          try { localStorage.setItem(LS_KEY, JSON.stringify(D)); } catch (e) {
            alert('Saqlash limti: juda ko‘p rasm. Ba’zilarini o‘chiring.');
          }
          btn.textContent = 'Yuklash';
          btn.disabled = false;
          if ($('#gal-files')) $('#gal-files').value = '';
          if ($('#gal-cap')) $('#gal-cap').value = '';
          page(1);
        }
      };
      im.onerror = () => { left--; URL.revokeObjectURL(url); };
      im.src = url;
    });
  }
  if (t.dataset.del) {
    const a = JSON.parse(t.dataset.del), i = a.pop();
    get(a).splice(i, 1);
    page(1);
    panel();
  }
  if (t.dataset.add) {
    const a = get(JSON.parse(t.dataset.add));
    const c = JSON.parse(JSON.stringify(a[0] || {}));
    (function z(o) {
      for (const k in o) typeof o[k] === 'object' ? z(o[k]) : (o[k] = '');
    })(c);
    a.push(c);
    page(1);
    panel();
  }
  if (t.id === 'sv') {
    try {
      localStorage.setItem(LS_KEY, JSON.stringify(D));
      t.textContent = '✓ Saqlandi!';
      setTimeout(() => { t.textContent = '💾 Saqlash'; }, 1500);
    } catch (x) {
      t.textContent = 'Xato!';
      setTimeout(() => { t.textContent = '💾 Saqlash'; }, 1500);
    }
  }
  if (t.id === 'dl') {
    try {
      const htmlStr = buildDownloadHtml();
      const blob = new Blob([htmlStr], { type: 'text/html;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'sox-texnikum.html';
      a.click();
      URL.revokeObjectURL(a.href);
      t.textContent = '✓ Yuklandi';
      setTimeout(() => { t.textContent = '⬇ HTML yuklab olish'; }, 1500);
    } catch (x) {
      alert('Yuklab olishda xato: ' + x.message);
    }
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && $('#login-modal').classList.contains('show')) tryLogin();
  if (e.ctrlKey && e.shiftKey && (e.key === 'A' || e.key === 'a')) {
    e.preventDefault();
    if (isAuthed()) {
      document.body.classList.add('ad');
      panel();
    } else showLogin();
  }
});

if (isAuthed()) document.body.classList.add('admin-ok');

document.addEventListener('submit', e => {
  const form = e.target;
  if (form.id !== 'ariza-form') return;
  const fd = new FormData(form);
  const rec = {
    ism: fd.get('ism') || '',
    telefon: fd.get('telefon') || '',
    yonalish: fd.get('yonalish') || '',
    tugilgan_yil: fd.get('tugilgan_yil') || '',
    izoh: fd.get('izoh') || '',
    sana: new Date().toLocaleString('uz-UZ')
  };
  try {
    const list = JSON.parse(localStorage.getItem(LS_ARIZA) || '[]');
    list.push(rec);
    localStorage.setItem(LS_ARIZA, JSON.stringify(list));
  } catch (err) {}
  const nx = $('#ariza-next');
  if (nx) nx.value = location.href.split('#')[0] + '#/home';
  const btn = $('#ariza-btn');
  if (btn) { btn.textContent = 'Yuborilmoqda…'; btn.disabled = true; }
});

page();
</script>
